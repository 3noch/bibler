[package]
name = "cloudflare"
version = "0.0.0"
edition.workspace = true

# The Cloudflare deployment: a Worker (accounts in D1, Google sign-in) and one SQLite-backed Durable Object per
# space running `crates/space`. Built for wasm32 by worker-build (see wrangler.toml and `make cloudflare`).

[lib]
crate-type = ["cdylib"]

[dependencies]
api = { path = "../api" }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
ops = { path = "../ops" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
space = { path = "../space" }
wasm-bindgen = "0.2.129"
worker = { version = "0.8.7", features = ["d1"] }

[lints]
workspace = true
